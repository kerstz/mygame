; STILLWORLD overrides of the stock scalability groups. Only values that
; matter for dense foliage + fog are changed; everything else is engine default.

[FoliageQuality@2]
foliage.DensityScale=0.7
grass.DensityScale=0.7

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[FoliageQuality@Cine]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0

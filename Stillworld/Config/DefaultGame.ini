+FsrEnable=r.FidelityFX.FSR4.Enabled
+FsrEnable=r.FidelityFX.FSR3.Enabled
+FsrFrameGen=r.FidelityFX.FI.Enabled
+DlssEnable=r.NGX.DLSS.Enable
+DlssFrameGen=r.Streamline.DLSSG.Enable
+Reflex=t.Streamline.Reflex.Enable


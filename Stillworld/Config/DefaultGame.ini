; Optional vendor plugins are detected at runtime through their console
; variables. Several names may be listed per feature (first one found wins),
; so newer plugin versions can be supported by editing this file only.
; AMD FSR plugin (FSR 3.1 / FSR 4) and NVIDIA DLSS + Streamline plugins.

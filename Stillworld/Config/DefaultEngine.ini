[/Script/LinuxTargetPlatform.LinuxTargetSettings]
; Vulkan SM6 is required for Nanite and Lumen on Linux (RADV / RX 6900 XT).
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Lighting: Lumen GI + reflections, Virtual Shadow Maps, Nanite.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.AllowStaticLighting=False
; Ray tracing support is compiled and enabled (needed for the Ultra preset);
; whether Lumen actually uses it is a runtime setting (r.Lumen.HardwareRayTracing).
r.RayTracing=True
; Dense grass is excluded from ray tracing by the scatter (BVH cost).
r.Lumen.HardwareRayTracing=False
; --- Anti-aliasing / upscaling: TSR (temporal super resolution).
r.AntiAliasingMethod=4
r.TSR.ShadingRejection.Flickering=1
; --- Physically based exposure and fog.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.SkyAtmosphere=True
r.VolumetricFog=True
r.SupportSkyAtmosphereAffectsHeightFog=True
; --- Foliage and virtual textures.
r.VirtualTextures=True
r.VT.EnableAutoImport=True
r.Substrate=False


[/Script/Engine.Engine]
; Measure real frame times (no smoothing) — see docs/PERFORMANCE.md.
bSmoothFrameRate=False

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0

[SystemSettings]
; No camera motion blur, ever (comfort in first person).
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
